[tool.uv.workspace]
members = ["apps/api", "libs/py/detection-core", "libs/py/simulator"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "asyncpg-stubs",
    "import-linter==2.15",
    "testcontainers[postgres,redis]==4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["ephoros_api", "ephoros_detection", "ephoros_sim"]

[tool.mypy]
strict = true
files = ["apps/api/src", "libs/py/detection-core/src", "libs/py/simulator/src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
markers = ["integration: needs Docker (Testcontainers)"]
pythonpath = ["apps/api/tests", "libs/py/detection-core/tests"]
