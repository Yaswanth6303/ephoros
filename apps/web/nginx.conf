server {
    listen 8080;
    root /usr/share/nginx/html;

    # hashed bundles never change
    location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
