[tools]
node = "24.22.0"
"npm:pnpm" = "12.14.0"  # mise's core pnpm backend finds no macOS asset for v12
python = "3.13.16"
uv = "0.13.3"
just = "1.59.0"
mkcert = "1.4.4"
gitleaks = "8.30.1"
lefthook = "2.2.2"

[env]
_.file = ".env"

[settings]
# default flavor resolves to a free-threaded build that mise cannot install
python.precompiled_flavor = "install_only_stripped"
