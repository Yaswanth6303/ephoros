http:
  routers:
    auth:
      rule: 'Host(`ephoros.localhost`) && PathPrefix(`/api/auth`)'
      priority: 100
      entryPoints: [websecure]
      middlewares: [auth-ratelimit]
      service: auth
      tls: {}
    api:
      rule: 'Host(`ephoros.localhost`) && PathPrefix(`/api/v1`)'
      priority: 100
      entryPoints: [websecure]
      service: api
      tls: {}
    web:
      rule: 'Host(`ephoros.localhost`)'
      priority: 1
      entryPoints: [websecure]
      service: web
      tls: {}
  middlewares:
    # per client IP; slows down password guessing (spec §9.3)
    auth-ratelimit:
      rateLimit:
        average: 10
        burst: 20
  services:
    auth:
      loadBalancer:
        servers:
          - url: 'http://auth:3000'
    api:
      loadBalancer:
        servers:
          - url: 'http://api:8000'
    web:
      loadBalancer:
        servers:
          - url: 'http://web:8080'

tls:
  certificates:
    - certFile: /etc/traefik/certs/local.pem
      keyFile: /etc/traefik/certs/local-key.pem
