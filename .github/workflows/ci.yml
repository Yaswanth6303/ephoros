name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_NO_CLOUD: 'true'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/uv
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'uv.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-packages
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - run: pnpm nx affected -t lint typecheck test build
      - run: just check-contract

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'uv.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      # CA not installed in CI; Playwright runs with ignoreHTTPSErrors
      - run: mkdir -p infra/traefik/certs && mkcert -cert-file infra/traefik/certs/local.pem -key-file infra/traefik/certs/local-key.pem ephoros.localhost localhost 127.0.0.1
      - run: pnpm exec playwright install --with-deps chromium
      - run: just e2e
      - if: failure()
        run: docker compose logs > compose.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            dist/.playwright/
            compose.log
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - name: Secrets in history
        run: gitleaks git --redact --no-banner
      - name: Python dependencies
        run: uv export --frozen --no-dev --all-packages --no-emit-workspace -o requirements.txt && uvx pip-audit==2.10.1 --disable-pip -r requirements.txt
      - name: JS dependencies
        run: pnpm audit --prod --audit-level high
      - run: cp .env.example .env && docker compose build api web
      - name: Scan api image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ephoros-api
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ephoros-web
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, e2e, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR image names must be lowercase
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
